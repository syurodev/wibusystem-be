server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push # Gửi log đến container "loki"

scrape_configs:
  - job_name: docker
    # Tự động phát hiện log từ các container Docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Lấy tên container làm nhãn 'container_name'
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"
      # Lấy tên service trong compose làm nhãn 'service'
      - source_labels:
          ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
