# Promtail Configuration for Production
# Optimized for OAuth2 Server structured logging

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# Position file to track what has been read
positions:
  filename: /tmp/positions.yaml
  sync_period: 10s
  ignore_invalid_yaml: false

# Loki client configuration
clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576  # 1MB
    timeout: 10s
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    # External labels applied to all logs
    external_labels:
      environment: production
      cluster: oauth2-server

# Scrape configurations
scrape_configs:
  # Docker containers scraping
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: [".*"]  # All containers

    relabel_configs:
      # Extract container name
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container_name"

      # Extract service name from docker compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"

      # Extract container ID
      - source_labels: ["__meta_docker_container_id"]
        target_label: "container_id"
        regex: "(.{12})"  # First 12 chars

      # Extract image name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_image"]
        target_label: "image"

    # Pipeline stages cho structured log parsing
    pipeline_stages:
      # Stage 1: Parse JSON logs
      - json:
          expressions:
            level: level
            timestamp: ts
            message: msg
            caller: caller
            category: category
            request_id: request_id
            user_id: user_id
            client_id: client_id
            ip_address: ip_address
            event_type: event_type
            status: status
            duration_ms: duration_ms
            method: method
            path: path
            status_code: status_code
            error: error
            operation_type: operation_type
            grant_type: grant_type
            token_type: token_type

      # Stage 2: Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000Z0700"
          action_on_failure: skip

      # Stage 3: Set labels based on parsed fields
      - labels:
          level: level
          category: category
          event_type: event_type
          status: status
          operation_type: operation_type
          method: method

      # Stage 4: Set structured metadata (Loki 3.x feature)
      - structured_metadata:
          request_id: request_id
          user_id: user_id
          client_id: client_id
          ip_address: ip_address
          grant_type: grant_type
          token_type: token_type

      # Stage 5: Add metrics
      - metrics:
          # Count log lines by level
          log_lines_total:
            type: Counter
            description: "Total count of log lines"
            source: level
            config:
              action: inc
              match_all: true

          # Count HTTP requests
          http_requests_total:
            type: Counter
            description: "Total HTTP requests"
            source: method
            config:
              action: inc

          # Track HTTP request duration
          http_request_duration_seconds:
            type: Histogram
            description: "HTTP request duration in seconds"
            source: duration_ms
            config:
              buckets: [0.1, 0.5, 1, 2, 5, 10]

      # Stage 6: Drop debug logs in production (optional)
      # - match:
      #     selector: '{level="debug"}'
      #     action: drop

      # Stage 7: Add output format
      - output:
          source: message

  # File-based scraping (backup/alternative)
  - job_name: system-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: system-logs
          __path__: /var/log/oauth2-server/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: ts
            message: msg
            category: category

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - labels:
          level: level
          category: category

# Limits
limits_config:
  readline_rate: 10000      # Max lines per second
  readline_burst: 20000     # Burst capacity
