# Loki Configuration for Production
# Optimized for OAuth2 Server logging với structured logs

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# Common configuration
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Limits configuration - optimized cho high-throughput logging
limits_config:
  # Allow structured metadata (Loki 3.x feature)
  allow_structured_metadata: true

  # Retention và ingestion limits
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days

  # Performance tuning
  ingestion_rate_mb: 10             # 10MB/s per tenant
  ingestion_burst_size_mb: 20       # Burst up to 20MB
  max_query_series: 1000
  max_query_parallelism: 16

  # Per stream rate limits
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB

  # Cardinality limits
  max_streams_per_user: 10000
  max_global_streams_per_user: 50000

  # Query limits
  max_entries_limit_per_query: 10000
  max_query_length: 721h            # 30 days
  max_query_lookback: 0             # No limit

  # Retention period
  retention_period: 720h            # 30 days

# Schema configuration
schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Storage configuration
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

# Compactor configuration - để cleanup old data
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# Query range configuration
query_range:
  align_queries_with_step: true
  max_retries: 5
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# Ingester configuration
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s

  # Chunk settings
  chunk_idle_period: 30s
  chunk_block_size: 262144          # 256KB
  chunk_target_size: 1572864        # 1.5MB
  chunk_retain_period: 1m
  max_chunk_age: 2h

  # WAL settings
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true
    replay_memory_ceiling: 1GB

# Querier configuration
querier:
  max_concurrent: 16
  query_timeout: 5m

# Query frontend configuration
frontend:
  max_outstanding_per_tenant: 256
  compress_responses: true

# Ruler configuration - for alerting
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093  # If you have Alertmanager
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true

# Analytics
analytics:
  reporting_enabled: false

# Tracing (optional - nếu bạn dùng Tempo/Jaeger)
# tracing:
#   enabled: true
