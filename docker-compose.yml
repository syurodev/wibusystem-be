version: "3.8"

services:
  # System Database (Modular Monolith - All schemas in one DB)
  system_dev:
    image: postgres:18.0
    container_name: system_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: system_dev
      POSTGRES_USER: system_dev
      POSTGRES_PASSWORD: system_dev
    ports:
      - "5432:5432"
    volumes:
      - system_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U system_dev -d system_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wibusystem_backend

  # Redis for caching and message queue
  redis:
    image: redis:8.2.1-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass 8767375c91873d04626c73c8aed8ce01
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wibusystem_backend

volumes:
  system_data:
    driver: local
  redis_data:
    driver: local

networks:
  wibusystem_backend:
    driver: bridge
    name: wibusystem-backend
