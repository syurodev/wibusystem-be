name: Deploy to Beta

on:
  push:
    branches:
      - beta
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.0)"
        required: false
        default: ""

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/wibusystem-be
  DEPLOY_PATH: /opt/wibusystem

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ -f VERSION ]; then
            echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:v${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "deploy/docker-compose.production.yml,deploy/clickhouse-config.xml,deploy/clickhouse-users.xml,deploy/grafana-datasource.yml,deploy/loki-config-production.yml,deploy/promtail-config-production.yml,migrations/"
          target: ${{ env.DEPLOY_PATH }}

      - name: Deploy via SSH (Zero Downtime)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}

            # Login to Docker Hub
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull new image (không downtime)
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Update .env with image tag
            sed -i 's|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}:latest|g' .env 2>/dev/null || echo "DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}:latest" >> .env

            # Zero downtime deploy: chỉ recreate app container, giữ nguyên databases
            docker compose --env-file .env -f deploy/docker-compose.production.yml up -d --no-deps --force-recreate wibusystem-be

            # Wait for new container to be healthy
            echo "Waiting for container to be healthy..."
            for i in {1..30}; do
              if docker compose --env-file .env -f deploy/docker-compose.production.yml ps wibusystem-be | grep -q "healthy"; then
                echo "✓ Container is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # Cleanup old images
            docker image prune -f

            echo "✓ Zero downtime deployment completed!"

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Check if container is running
            if docker ps | grep -q wibusystem-be; then
              echo "✓ Container is running"
              
              # Check health endpoint
              sleep 5
              curl -f http://localhost:8080/health || echo "⚠ Health check failed, but container is running"
            else
              echo "✗ Container is not running!"
              docker compose --env-file ${{ env.DEPLOY_PATH }}/.env -f ${{ env.DEPLOY_PATH }}/deploy/docker-compose.production.yml logs wibusystem-be
              exit 1
            fi
