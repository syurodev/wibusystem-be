<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorization Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #FEE2E2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-icon svg {
            width: 48px;
            height: 48px;
            color: #DC2626;
        }

        h1 {
            font-size: 24px;
            color: #1F2937;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .error-code {
            display: inline-block;
            background: #FEE2E2;
            color: #DC2626;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .error-description {
            color: #6B7280;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .hint {
            background: #F3F4F6;
            border-left: 3px solid #667eea;
            padding: 12px 16px;
            border-radius: 6px;
            color: #4B5563;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            margin: 24px 0;
        }

        .actions {
            margin-top: 32px;
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #F3F4F6;
            color: #6B7280;
        }

        .btn-secondary:hover {
            background: #E5E7EB;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #E5E7EB;
            color: #9CA3AF;
            font-size: 13px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>

        <h1>Authorization Error</h1>
        <span class="error-code">{{ .Error }}</span>

        <p class="error-description">
            {{ .ErrorDescription }}
        </p>

        {{if .Hint}}
        <div class="hint">
            💡 {{ .Hint }}
        </div>
        {{end}}

        <div class="actions">
            {{if .RedirectURI}}
            <!-- If we have redirect_uri, show "Try Again" button that goes back to the app -->
            <a href="{{ .RedirectURI }}" class="btn btn-primary">
                ← Return to Application
            </a>
            {{else}}
            <!-- If no redirect_uri, suggest closing window -->
            <button onclick="window.close()" class="btn btn-primary">
                Close Window
            </button>
            {{end}}

            <button onclick="history.back()" class="btn btn-secondary">
                ← Go Back
            </button>
        </div>

        <div class="footer">
            <p>If you continue to experience issues, please contact support.</p>
            {{if .ClientID}}
            <p style="margin-top: 8px; font-family: monospace; font-size: 11px;">
                Client ID: {{ .ClientID }}
            </p>
            {{end}}
        </div>
    </div>

    <script>
        // Auto-close window after 60 seconds if opened in popup
        if (window.opener && !{{ .RedirectURI }}) {
            setTimeout(() => {
                if (confirm('This window will close automatically. Click OK to close now.')) {
                    window.close();
                }
            }, 60000);
        }
    </script>
</body>
</html>
