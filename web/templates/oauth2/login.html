<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <!-- htmx & Alpine.js -->
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --background: #ffffff;
        --foreground: #1f2937;
        --card: #ffffff;
        --card-foreground: #1f2937;
        --primary: #1f2937;
        --primary-foreground: #fafafa;
        --secondary: #f4f4f5;
        --secondary-foreground: #1f2937;
        --muted: #f4f4f5;
        --muted-foreground: #6b7280;
        --accent: #f4f4f5;
        --accent-foreground: #1f2937;
        --destructive: #ef4444;
        --border: #e5e7eb;
        --input: #e5e7eb;
        --ring: #a1a1aa;
        --radius: 0.75rem;
        --gradient-start: #fef3c7;
        --gradient-mid: #fca5a5;
        --gradient-end: #c084fc;
        --shape-1: #93c5fd;
        --shape-2: #a78bfa;
        --shape-3: #f0abfc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f0f10;
          --foreground: #fafafa;
          --card: #18181b;
          --card-foreground: #fafafa;
          --primary: #e4e4e7;
          --primary-foreground: #18181b;
          --secondary: #27272a;
          --secondary-foreground: #fafafa;
          --muted: #27272a;
          --muted-foreground: #a1a1aa;
          --accent: #27272a;
          --accent-foreground: #fafafa;
          --destructive: #f87171;
          --border: rgba(255, 255, 255, 0.1);
          --input: rgba(255, 255, 255, 0.15);
          --ring: #71717a;
          --gradient-start: #312e81;
          --gradient-mid: #581c87;
          --gradient-end: #831843;
          --shape-1: #3b82f6;
          --shape-2: #8b5cf6;
          --shape-3: #d946ef;
        }
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--background);
        color: var(--foreground);
      }

      .card {
        height: 100vh;
        display: grid;
        grid-template-columns: 45% 55%;
      }

      .illustration {
        background: linear-gradient(
          135deg,
          var(--gradient-start) 0%,
          var(--gradient-mid) 50%,
          var(--gradient-end) 100%
        );
        position: relative;
        padding: 3rem;
        display: flex;
        flex-direction: column;
      }

      .logo {
        height: 40px;
        width: auto;
        object-fit: contain;
        object-position: left;
      }

      .artwork {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .shape {
        position: absolute;
        border-radius: 50% 40% 60% 50%;
        filter: blur(60px);
        opacity: 0.6;
      }

      .shape1 {
        width: 280px;
        height: 320px;
        background: var(--shape-1);
        top: 20%;
        left: 10%;
      }
      .shape2 {
        width: 300px;
        height: 300px;
        background: var(--shape-2);
        top: 30%;
        left: 25%;
      }
      .shape3 {
        width: 200px;
        height: 280px;
        background: var(--shape-3);
        top: 45%;
        left: 40%;
      }

      .content {
        background: var(--card);
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
      }

      .content-wrapper {
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--card-foreground);
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: var(--muted-foreground);
        margin-bottom: 2.5rem;
        font-size: 0.9375rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--card-foreground);
        font-weight: 500;
        font-size: 0.875rem;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 0.875rem 1rem;
        border: 1px solid var(--border);
        background: var(--secondary);
        border-radius: var(--radius);
        font-size: 0.9375rem;
        transition: all 0.15s ease-in-out;
        color: var(--card-foreground);
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 2px var(--ring);
      }

      input::placeholder {
        color: var(--muted-foreground);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 0.5rem;
        accent-color: var(--primary);
      }

      .checkbox-label {
        font-size: 0.875rem;
        color: var(--muted-foreground);
        cursor: pointer;
      }

      .btn {
        width: 100%;
        padding: 0.875rem;
        background: var(--primary);
        color: var(--primary-foreground);
        border: none;
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }

      .alert {
        padding: 0.875rem;
        border-radius: var(--radius);
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
        animation: slideIn 0.3s ease-out;
      }

      .alert-error {
        background: rgba(239, 68, 68, 0.1);
        color: var(--destructive);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .footer-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .footer-link a {
        color: var(--ring);
        text-decoration: none;
        font-weight: 500;
      }

      .footer-link a:hover {
        text-decoration: underline;
      }

      .link-btn {
        background: none;
        border: none;
        color: var(--ring);
        font-size: 0.875rem;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        padding: 0;
      }

      .link-btn:hover {
        text-decoration: underline;
      }

      .passkey-section {
        text-align: center;
        margin-bottom: 2rem;
      }

      .passkey-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1rem;
        background: linear-gradient(
          135deg,
          var(--gradient-start),
          var(--gradient-end)
        );
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .passkey-icon img {
        width: 32px;
        height: 32px;
        filter: brightness(0);
      }

      @media (prefers-color-scheme: dark) {
        .passkey-icon img {
          filter: brightness(0) invert(1);
        }
      }

      .passkey-title {
        font-weight: 600;
        color: var(--card-foreground);
        margin-bottom: 0.5rem;
      }

      .passkey-desc {
        color: var(--muted-foreground);
        font-size: 0.9rem;
      }

      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
      }

      .icon-sm {
        width: 16px;
        height: 16px;
      }

      .spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* htmx states */
      .htmx-request .btn-text {
        display: none;
      }
      .htmx-request .btn-loading {
        display: inline-flex !important;
      }
      .btn-loading {
        display: none;
      }

      /* Responsive */
      @media (max-width: 968px) {
        .card {
          grid-template-columns: 1fr;
        }
        .illustration {
          display: none;
        }
        .content {
          padding: 2rem;
        }
      }

      @media (max-width: 480px) {
        .content {
          padding: 1.5rem;
        }
        h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body x-data="loginFlow()" x-init="init()">
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <h1>Sign In</h1>
          <p class="subtitle">Enter your credentials to access your account</p>

          <!-- Alert -->
          <div
            x-show="error"
            x-transition
            class="alert alert-error"
            x-text="error"
          ></div>

          <!-- Step 1: Email -->
          <div x-show="step === 'email'" x-transition>
            <form
              hx-post="/oauth2/login/check"
              hx-swap="none"
              @htmx:after-request="handleEmailCheck($event)"
            >
              <input type="hidden" name="request_id" value="{{ .RequestID }}" />
              <div class="form-group">
                <label for="email">Email or Username</label>
                <input
                  type="text"
                  id="email"
                  name="email"
                  x-model="email"
                  required
                  autocomplete="username"
                  placeholder="your@email.com or username"
                  autofocus
                />
              </div>
              <button type="submit" class="btn">
                <span class="btn-text">Next</span>
                <span class="btn-loading">
                  <img
                    src="/static/icons/loader-circle.svg"
                    class="icon spinner"
                    alt=""
                  />
                  Checking...
                </span>
              </button>
            </form>
            <div class="footer-link">
              Don't have an account?
              <a
                href="/oauth2/register{{ if .RequestID }}?request_id={{ .RequestID }}{{ end }}"
                >Sign up</a
              >
            </div>
          </div>

          <!-- Step 2: Passkey -->
          <div x-show="step === 'passkey'" x-transition style="display: none">
            <div class="passkey-section">
              <div class="passkey-icon">
                <img src="/static/icons/key-round.svg" alt="" />
              </div>
              <h3 class="passkey-title">Use your passkey</h3>
              <p class="passkey-desc">
                Authenticate with Face ID, Touch ID, or screen lock
              </p>
            </div>

            <button
              type="button"
              class="btn"
              @click="startPasskeyAuth"
              :disabled="loading"
              style="margin-bottom: 1rem"
            >
              <img
                src="/static/icons/fingerprint-pattern.svg"
                class="icon"
                alt=""
              />
              <span x-show="!loading">Sign in with Passkey</span>
              <span x-show="loading">
                <img
                  src="/static/icons/loader-circle.svg"
                  class="icon spinner"
                  alt=""
                />
                Waiting...
              </span>
            </button>

            <div style="text-align: center; margin-bottom: 1rem">
              <button type="button" class="link-btn" @click="step = 'password'">
                Use password instead
              </button>
            </div>
            <div style="text-align: center">
              <button
                type="button"
                class="link-btn"
                @click="step = 'email'"
                style="color: var(--muted-foreground)"
              >
                <img
                  src="/static/icons/arrow-left.svg"
                  class="icon-sm"
                  alt=""
                  style="filter: brightness(0.5)"
                />
                Back to email
              </button>
            </div>
          </div>

          <!-- Step 3: Password -->
          <div x-show="step === 'password'" x-transition style="display: none">
            <form
              hx-post="/oauth2/login"
              hx-swap="none"
              @htmx:before-request="loading = true; error = ''"
              @htmx:after-request="handleLogin($event)"
            >
              <input type="hidden" name="request_id" value="{{ .RequestID }}" />
              <input type="hidden" name="email" :value="email" />

              <div class="form-group">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 0.5rem;
                  "
                >
                  <label for="password" style="margin-bottom: 0"
                    >Password</label
                  >
                  <span
                    style="font-size: 0.875rem; color: var(--muted-foreground)"
                    x-text="email"
                  ></span>
                </div>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  x-ref="passwordInput"
                />
              </div>

              <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember" />
                <label
                  for="remember"
                  class="checkbox-label"
                  style="margin-bottom: 0"
                  >Remember this computer</label
                >
              </div>

              <button type="submit" class="btn" :disabled="loading">
                <template x-if="!loading">
                  <span>Sign In</span>
                </template>
                <template x-if="loading">
                  <span style="display: flex; align-items: center; gap: 0.5rem">
                    <img
                      src="/static/icons/loader-circle.svg"
                      class="icon spinner"
                      alt=""
                    />
                    Signing in...
                  </span>
                </template>
              </button>
            </form>

            <div style="text-align: center; margin-top: 1rem">
              <button
                type="button"
                class="link-btn"
                @click="step = 'email'"
                style="color: var(--muted-foreground)"
              >
                <img
                  src="/static/icons/arrow-left.svg"
                  class="icon-sm"
                  alt=""
                  style="filter: brightness(0.5)"
                />
                Back to email
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function loginFlow() {
        return {
          step: "email",
          email: "",
          loading: false,
          error: "",
          hasPasskeys: false,

          init() {
            const urlParams = new URLSearchParams(
              globalThis.window.location.search
            );
            if (urlParams.has("email")) {
              this.email = urlParams.get("email");
            }
          },

          handleEmailCheck(event) {
            if (event.detail.successful) {
              try {
                const data = JSON.parse(event.detail.xhr.responseText);
                this.hasPasskeys = data.has_passkeys;
                this.step = this.hasPasskeys ? "passkey" : "password";
                if (!this.hasPasskeys) {
                  this.$nextTick(() => this.$refs.passwordInput?.focus());
                }
              } catch {
                this.step = "password";
              }
            } else {
              this.step = "password";
            }
          },

          handleLogin(event) {
            this.loading = false;
            if (event.detail.successful) {
              try {
                const data = JSON.parse(event.detail.xhr.responseText);
                if (data.success && data.redirect_url) {
                  globalThis.window.location.href = data.redirect_url;
                  return;
                }
              } catch {
                // If parsing fails, try default redirect
                globalThis.window.location.href =
                  "/oauth2/auth?request_id={{ .RequestID }}";
                return;
              }
            }
            // Handle error
            try {
              const data = JSON.parse(event.detail.xhr.responseText);
              this.error = data.message || "Invalid email or password";
            } catch {
              this.error = "An error occurred. Please try again.";
            }
          },

          async startPasskeyAuth() {
            this.loading = true;
            this.error = "";

            try {
              const beginResponse = await fetch(
                "/api/v1/auth/passkey/authenticate/begin",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ email: this.email }),
                }
              );

              if (!beginResponse.ok)
                throw new Error("Failed to start passkey authentication");

              const data = await beginResponse.json();
              let options = data.publicKey?.publicKey || data.publicKey;
              const userId = data.user_id;

              if (!options?.challenge)
                throw new Error("Invalid passkey options");

              options.challenge = this.base64urlDecode(options.challenge);
              if (options.allowCredentials) {
                for (const cred of options.allowCredentials) {
                  if (cred.id) cred.id = this.base64urlDecode(cred.id);
                }
              }

              const credential = await globalThis.navigator.credentials.get({
                publicKey: options,
              });

              const credentialJSON = {
                id: credential.id,
                rawId: this.base64urlEncode(credential.rawId),
                type: credential.type,
                response: {
                  authenticatorData: this.base64urlEncode(
                    credential.response.authenticatorData
                  ),
                  clientDataJSON: this.base64urlEncode(
                    credential.response.clientDataJSON
                  ),
                  signature: this.base64urlEncode(
                    credential.response.signature
                  ),
                  userHandle: credential.response.userHandle
                    ? this.base64urlEncode(credential.response.userHandle)
                    : null,
                },
              };

              const finishResponse = await fetch(
                `/api/v1/auth/passkey/authenticate/finish?user_id=${userId}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(credentialJSON),
                }
              );

              if (finishResponse.ok) {
                globalThis.window.location.href =
                  "/oauth2/auth?request_id={{ .RequestID }}";
              } else {
                const errorData = await finishResponse.json();
                this.error =
                  "Authentication failed: " +
                  (errorData.message || "Unknown error");
              }
            } catch (e) {
              console.error("Passkey Auth Error:", e);
              this.error = "Passkey authentication failed. Please try again.";
            } finally {
              this.loading = false;
            }
          },

          base64urlDecode(base64url) {
            const base64 = base64url.replace(/-/g, "+").replace(/_/g, "/");
            const paddedBase64 = base64.padEnd(
              base64.length + ((4 - (base64.length % 4)) % 4),
              "="
            );
            const binaryString = atob(paddedBase64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++)
              bytes[i] = binaryString.charCodeAt(i);
            return bytes.buffer;
          },

          base64urlEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=/g, "");
          },
        };
      }
    </script>
  </body>
</html>
