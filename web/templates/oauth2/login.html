<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <!-- htmx & Alpine.js -->
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      /* Page specific styles if any */
    </style>
  </head>
  <body x-data="loginFlow()" x-init="init()">
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <h1>Sign In</h1>
          <p class="subtitle">Enter your credentials to access your account</p>

          <!-- Alert -->
          <div
            x-show="error"
            x-transition
            class="alert alert-error"
            x-text="error"
          ></div>

          <!-- Step 1: Email -->
          <div x-show="step === 'email'" x-transition>
            <form
              hx-post="/oauth2/login/check"
              hx-swap="none"
              @htmx:after-request="handleEmailCheck($event)"
            >
              <input type="hidden" name="request_id" value="{{ .RequestID }}" />
              <div class="form-group">
                <label for="email">Email or Username</label>
                <input
                  type="text"
                  id="email"
                  name="email"
                  x-model="email"
                  required
                  autocomplete="username"
                  placeholder="your@email.com or username"
                  autofocus
                />
              </div>
              <button type="submit" class="btn">
                <span class="btn-text">Next</span>
                <span class="btn-loading">
                  <img
                    src="/static/icons/loader-circle.svg"
                    class="icon spinner"
                    alt=""
                  />
                  Checking...
                </span>
              </button>
            </form>
            <div class="footer-link">
              Don't have an account?
              <a
                href="/oauth2/register{{ if .RequestID }}?request_id={{ .RequestID }}{{ end }}"
                >Sign up</a
              >
            </div>
          </div>

          <!-- Step 2: Passkey -->
          <div x-show="step === 'passkey'" x-transition style="display: none">
            <div class="passkey-section">
              <div class="passkey-icon">
                <img src="/static/icons/key-round.svg" alt="" />
              </div>
              <h3 class="passkey-title">Use your passkey</h3>
              <p class="passkey-desc">
                Authenticate with Face ID, Touch ID, or screen lock
              </p>
            </div>

            <button
              type="button"
              class="btn"
              @click="startPasskeyAuth"
              :disabled="loading"
              style="margin-bottom: 1rem"
            >
              <img
                src="/static/icons/fingerprint-pattern.svg"
                class="icon"
                alt=""
              />
              <span x-show="!loading">Sign in with Passkey</span>
              <span x-show="loading">
                <img
                  src="/static/icons/loader-circle.svg"
                  class="icon spinner"
                  alt=""
                />
                Waiting...
              </span>
            </button>

            <div style="text-align: center; margin-bottom: 1rem">
              <button type="button" class="link-btn" @click="step = 'password'">
                Use password instead
              </button>
            </div>
            <div style="text-align: center">
              <button
                type="button"
                class="link-btn"
                @click="step = 'email'"
                style="color: var(--muted-foreground)"
              >
                <img
                  src="/static/icons/arrow-left.svg"
                  class="icon-sm"
                  alt=""
                  style="filter: brightness(0.5)"
                />
                Back to email
              </button>
            </div>
          </div>

          <!-- Step 3: Password -->
          <div x-show="step === 'password'" x-transition style="display: none">
            <form
              hx-post="/oauth2/login"
              hx-swap="none"
              @htmx:before-request="loading = true; error = ''"
              @htmx:after-request="handleLogin($event)"
            >
              <input type="hidden" name="request_id" value="{{ .RequestID }}" />
              <input type="hidden" name="email" :value="email" />

              <div class="form-group">
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    margin-bottom: 0.5rem;
                  "
                >
                  <label for="password" style="margin-bottom: 0"
                    >Password</label
                  >
                  <span
                    style="font-size: 0.875rem; color: var(--muted-foreground)"
                    x-text="email"
                  ></span>
                </div>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="Enter your password"
                  x-ref="passwordInput"
                />
              </div>

              <div class="checkbox-group">
                <input type="checkbox" id="remember" name="remember" />
                <label
                  for="remember"
                  class="checkbox-label"
                  style="margin-bottom: 0"
                  >Remember this computer</label
                >
              </div>

              <button type="submit" class="btn" :disabled="loading">
                <template x-if="!loading">
                  <span>Sign In</span>
                </template>
                <template x-if="loading">
                  <span style="display: flex; align-items: center; gap: 0.5rem">
                    <img
                      src="/static/icons/loader-circle.svg"
                      class="icon spinner"
                      alt=""
                    />
                    Signing in...
                  </span>
                </template>
              </button>
            </form>

            <div style="text-align: center; margin-top: 1rem">
              <button
                type="button"
                class="link-btn"
                @click="step = 'email'"
                style="color: var(--muted-foreground)"
              >
                <img
                  src="/static/icons/arrow-left.svg"
                  class="icon-sm"
                  alt=""
                  style="filter: brightness(0.5)"
                />
                Back to email
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function loginFlow() {
        return {
          step: "email",
          email: "",
          loading: false,
          error: "",
          hasPasskeys: false,

          init() {
            const urlParams = new URLSearchParams(
              globalThis.window.location.search
            );
            if (urlParams.has("email")) {
              this.email = urlParams.get("email");
            }
          },

          handleEmailCheck(event) {
            if (event.detail.successful) {
              try {
                const data = JSON.parse(event.detail.xhr.responseText);

                // Check if user exists first
                if (!data.exists) {
                  this.error =
                    "User not found. Please check your email or username.";
                  return;
                }

                this.hasPasskeys = data.has_passkeys;
                this.step = this.hasPasskeys ? "passkey" : "password";
                if (!this.hasPasskeys) {
                  this.$nextTick(() => this.$refs.passwordInput?.focus());
                }
              } catch {
                this.step = "password";
              }
            } else {
              this.error = "An error occurred. Please try again.";
            }
          },

          handleLogin(event) {
            this.loading = false;
            if (event.detail.successful) {
              try {
                const data = JSON.parse(event.detail.xhr.responseText);
                if (data.success && data.redirect_url) {
                  globalThis.window.location.href = data.redirect_url;
                  return;
                }
              } catch {
                // If parsing fails, try default redirect
                globalThis.window.location.href =
                  "/oauth2/auth?request_id={{ .RequestID }}";
                return;
              }
            }
            // Handle error
            try {
              const data = JSON.parse(event.detail.xhr.responseText);
              this.error = data.message || "Invalid email or password";
            } catch {
              this.error = "An error occurred. Please try again.";
            }
          },

          async startPasskeyAuth() {
            this.loading = true;
            this.error = "";

            try {
              const beginResponse = await fetch(
                "/api/v1/auth/passkey/authenticate/begin",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ email: this.email }),
                }
              );

              if (!beginResponse.ok)
                throw new Error("Failed to start passkey authentication");

              const data = await beginResponse.json();
              let options = data.publicKey?.publicKey || data.publicKey;
              const userId = data.user_id;

              if (!options?.challenge)
                throw new Error("Invalid passkey options");

              options.challenge = this.base64urlDecode(options.challenge);
              if (options.allowCredentials) {
                for (const cred of options.allowCredentials) {
                  if (cred.id) cred.id = this.base64urlDecode(cred.id);
                }
              }

              const credential = await globalThis.navigator.credentials.get({
                publicKey: options,
              });

              const credentialJSON = {
                id: credential.id,
                rawId: this.base64urlEncode(credential.rawId),
                type: credential.type,
                response: {
                  authenticatorData: this.base64urlEncode(
                    credential.response.authenticatorData
                  ),
                  clientDataJSON: this.base64urlEncode(
                    credential.response.clientDataJSON
                  ),
                  signature: this.base64urlEncode(
                    credential.response.signature
                  ),
                  userHandle: credential.response.userHandle
                    ? this.base64urlEncode(credential.response.userHandle)
                    : null,
                },
              };

              const finishResponse = await fetch(
                `/api/v1/auth/passkey/authenticate/finish?user_id=${userId}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(credentialJSON),
                }
              );

              if (finishResponse.ok) {
                globalThis.window.location.href =
                  "/oauth2/auth?request_id={{ .RequestID }}";
              } else {
                const errorData = await finishResponse.json();
                this.error =
                  "Authentication failed: " +
                  (errorData.message || "Unknown error");
              }
            } catch (e) {
              console.error("Passkey Auth Error:", e);
              this.error = "Passkey authentication failed. Please try again.";
            } finally {
              this.loading = false;
            }
          },

          base64urlDecode(base64url) {
            const base64 = base64url.replace(/-/g, "+").replace(/_/g, "/");
            const paddedBase64 = base64.padEnd(
              base64.length + ((4 - (base64.length % 4)) % 4),
              "="
            );
            const binaryString = atob(paddedBase64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++)
              bytes[i] = binaryString.charCodeAt(i);
            return bytes.buffer;
          },

          base64urlEncode(buffer) {
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
              .replace(/\+/g, "-")
              .replace(/\//g, "_")
              .replace(/=/g, "");
          },
        };
      }
    </script>
  </body>
</html>
