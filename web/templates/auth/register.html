<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      .card {
        height: 100vh;
        display: grid;
        grid-template-columns: 45% 55%;
      }

      .illustration {
        background: linear-gradient(
          135deg,
          #fef3c7 0%,
          #fca5a5 50%,
          #c084fc 100%
        );
        position: relative;
        padding: 3rem;
        display: flex;
        flex-direction: column;
      }

      .logo {
        height: 40px;
        width: auto;
        object-fit: contain;
        object-position: left;
      }

      .artwork {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .shape {
        position: absolute;
        border-radius: 50% 40% 60% 50%;
        filter: blur(60px);
        opacity: 0.6;
      }

      .shape1 {
        width: 280px;
        height: 320px;
        background: #93c5fd;
        top: 20%;
        left: 10%;
      }

      .shape2 {
        width: 300px;
        height: 300px;
        background: #a78bfa;
        top: 30%;
        left: 25%;
      }

      .shape3 {
        width: 200px;
        height: 280px;
        background: #f0abfc;
        top: 45%;
        left: 40%;
      }

      .content {
        background: white;
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
      }

      .content-wrapper {
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 0.5rem;
        line-height: 1.2;
      }

      .subtitle {
        color: #6b7280;
        margin-bottom: 2.5rem;
        font-size: 0.9375rem;
        line-height: 1.5;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: #374151;
        font-weight: 500;
        font-size: 0.875rem;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 0.875rem 1rem;
        border: none;
        background: #f3f4f6;
        border-radius: 12px;
        font-size: 0.9375rem;
        transition: background 0.15s ease-in-out;
        color: #1f2937;
      }

      input[type="email"]:focus,
      input[type="password"]:focus,
      input[type="text"]:focus {
        outline: none;
        background: #e5e7eb;
      }

      input::placeholder {
        color: #9ca3af;
      }

      button {
        width: 100%;
        padding: 0.875rem;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .success {
        background: #d1fae5;
        color: #065f46;
        padding: 0.875rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
        border: 1px solid #6ee7b7;
        display: none;
      }

      .error {
        background: #fee2e2;
        color: #dc2626;
        padding: 0.875rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
        border: 1px solid #fecaca;
        display: none;
      }

      .footer-link {
        text-align: center;
        margin-top: 1.5rem;
        color: #6b7280;
        font-size: 0.875rem;
      }

      .footer-link a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
        margin-left: 0.25rem;
      }

      .footer-link a:hover {
        text-decoration: underline;
      }

      .password-strength {
        margin-top: 0.5rem;
        font-size: 0.8125rem;
      }

      .strength-weak {
        color: #dc2626;
      }

      .strength-medium {
        color: #f59e0b;
      }

      .strength-strong {
        color: #10b981;
      }

      /* Responsive */
      @media (max-width: 968px) {
        .card {
          grid-template-columns: 1fr;
        }

        .illustration {
          display: none;
        }

        .content {
          padding: 2rem;
        }
      }

      @media (max-width: 480px) {
        .content {
          padding: 1.5rem;
        }

        h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <h1>Create Account</h1>
          <p class="subtitle">Join us and start your journey today</p>

          <div class="success" id="success"></div>
          <div class="error" id="error"></div>

          <form id="registerForm">
            <div class="form-group">
              <label for="full_name">Full Name</label>
              <input
                type="text"
                id="full_name"
                name="full_name"
                required
                autocomplete="name"
                placeholder="John Doe"
              />
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
                placeholder="your@email.com"
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="new-password"
                placeholder="Create a strong password"
              />
              <div class="password-strength" id="passwordStrength"></div>
            </div>

            <button type="submit" id="submitBtn">Create Account</button>
          </form>

          <div class="footer-link">
            Already have an account? <a href="/oauth2/login">Sign in</a>
          </div>
        </div>
      </div>
    </div>

    <script>
      const passwordInput = document.getElementById("password");
      const strengthIndicator = document.getElementById("passwordStrength");
      const form = document.getElementById("registerForm");
      const submitBtn = document.getElementById("submitBtn");
      const errorDiv = document.getElementById("error");
      const successDiv = document.getElementById("success");

      // Password strength checker
      passwordInput.addEventListener("input", (e) => {
        const password = e.target.value;
        const strength = checkPasswordStrength(password);

        if (password.length === 0) {
          strengthIndicator.textContent = "";
          return;
        }

        if (strength === "strong") {
          strengthIndicator.textContent = "✓ Strong password";
          strengthIndicator.className = "password-strength strength-strong";
        } else if (strength === "medium") {
          strengthIndicator.textContent = "⚠ Medium strength";
          strengthIndicator.className = "password-strength strength-medium";
        } else {
          strengthIndicator.textContent = "✗ Weak password";
          strengthIndicator.className = "password-strength strength-weak";
        }
      });

      function checkPasswordStrength(password) {
        if (password.length < 8) return "weak";

        let hasUpper = /[A-Z]/.test(password);
        let hasLower = /[a-z]/.test(password);
        let hasDigit = /[0-9]/.test(password);
        let hasSpecial = /[^A-Za-z0-9]/.test(password);

        let conditions = 0;
        if (hasUpper) conditions++;
        if (hasLower) conditions++;
        if (hasDigit) conditions++;
        if (hasSpecial) conditions++;

        if (conditions >= 3 && password.length >= 12) return "strong";
        if (conditions >= 2 && password.length >= 8) return "medium";
        return "weak";
      }

      // Form submission
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const data = {
          full_name: formData.get("full_name"),
          email: formData.get("email"),
          password: formData.get("password"),
        };

        errorDiv.style.display = "none";
        successDiv.style.display = "none";
        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          const response = await fetch("/api/v1/auth/register", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(data),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || "Registration failed");
          }

          // Success
          successDiv.textContent =
            result.message ||
            "Account created successfully! Please check your email to verify your account.";
          successDiv.style.display = "block";
          form.reset();
          strengthIndicator.textContent = "";

          // Redirect to login after 3 seconds
          setTimeout(() => {
            const requestId = "{{.RequestID}}";
            const loginUrl = requestId ? `/oauth2/login?request_id=${requestId}` : "/oauth2/login";
            window.location.href = loginUrl;
          }, 3000);
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = "block";
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Account";
        }
      });
    </script>
  </body>
</html>
