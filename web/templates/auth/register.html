<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <!-- htmx & Alpine.js -->
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      /* Page specific styles if any */
    </style>
  </head>
  <body x-data="registerForm()">
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <h1>Create Account</h1>
          <p class="subtitle">Join us and start your journey today</p>

          <!-- Alerts -->
          <div
            x-show="success"
            x-transition
            class="alert alert-success"
            x-text="success"
          ></div>
          <div
            x-show="error"
            x-transition
            class="alert alert-error"
            x-text="error"
          ></div>

          <form @submit.prevent="handleSubmit">
            <div class="form-group">
              <label for="full_name">Full Name</label>
              <input
                type="text"
                id="full_name"
                name="full_name"
                x-model="fullName"
                required
                autocomplete="name"
                placeholder="John Doe"
              />
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                x-model="email"
                required
                autocomplete="email"
                placeholder="your@email.com"
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                x-model="password"
                @input="checkStrength"
                required
                autocomplete="new-password"
                placeholder="Create a strong password"
              />
              <div
                class="password-strength"
                :class="strengthClass"
                x-show="password.length > 0"
              >
                <img
                  x-show="strength === 'strong'"
                  src="/static/icons/circle-check.svg"
                  class="icon-sm"
                  :style="{ filter: 'invert(48%) sepia(79%) saturate(2476%) hue-rotate(86deg) brightness(118%) contrast(119%)' }"
                  alt=""
                />
                <img
                  x-show="strength === 'medium'"
                  src="/static/icons/triangle-alert.svg"
                  class="icon-sm"
                  :style="{ filter: 'invert(73%) sepia(60%) saturate(3000%) hue-rotate(3deg) brightness(108%) contrast(101%)' }"
                  alt=""
                />
                <img
                  x-show="strength === 'weak'"
                  src="/static/icons/shield-x.svg"
                  class="icon-sm"
                  :style="{ filter: 'invert(27%) sepia(94%) saturate(5057%) hue-rotate(352deg) brightness(96%) contrast(91%)' }"
                  alt=""
                />
                <span x-text="strengthText"></span>
              </div>
            </div>

            <button type="submit" class="btn" :disabled="loading">
              <template x-if="!loading">
                <span>Create Account</span>
              </template>
              <template x-if="loading">
                <span style="display: flex; align-items: center; gap: 0.5rem">
                  <img
                    src="/static/icons/loader-circle.svg"
                    class="icon spinner"
                    alt=""
                    style="filter: brightness(0) invert(1)"
                  />
                  Creating...
                </span>
              </template>
            </button>
          </form>

          <div class="footer-link">
            Already have an account?
            <a
              href="/oauth2/login{{ if .RequestID }}?request_id={{ .RequestID }}{{ end }}"
              >Sign in</a
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      function registerForm() {
        return {
          fullName: "",
          email: "",
          password: "",
          loading: false,
          error: "",
          success: "",
          strength: "",

          get strengthClass() {
            return `password-strength strength-${this.strength}`;
          },

          get strengthText() {
            if (this.strength === "strong") return "Strong password";
            if (this.strength === "medium") return "Medium strength";
            return "Weak password";
          },

          checkStrength() {
            const pwd = this.password;
            if (pwd.length < 8) {
              this.strength = "weak";
              return;
            }

            let conditions = 0;
            if (/[A-Z]/.test(pwd)) conditions++;
            if (/[a-z]/.test(pwd)) conditions++;
            if (/[0-9]/.test(pwd)) conditions++;
            if (/[^A-Za-z0-9]/.test(pwd)) conditions++;

            if (conditions >= 3 && pwd.length >= 12) {
              this.strength = "strong";
            } else if (conditions >= 2 && pwd.length >= 8) {
              this.strength = "medium";
            } else {
              this.strength = "weak";
            }
          },

          async handleSubmit() {
            this.error = "";
            this.success = "";
            this.loading = true;

            try {
              const response = await fetch("/api/v1/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  full_name: this.fullName,
                  email: this.email,
                  password: this.password,
                }),
              });

              const result = await response.json();

              if (!response.ok) {
                throw new Error(result.message || "Registration failed");
              }

              this.success =
                result.message || "Account created! Redirecting...";

              // Redirect immediately to OAuth auth endpoint (user is now logged in via session)
              globalThis.setTimeout(() => {
                const requestId = "{{ .RequestID }}";
                if (requestId) {
                  // Continue OAuth flow
                  globalThis.window.location.href = `/oauth2/auth?request_id=${requestId}`;
                } else {
                  // No OAuth flow, just go to login
                  globalThis.window.location.href = "/oauth2/login";
                }
              }, 1000);
            } catch (err) {
              this.error = err.message;
            } finally {
              this.loading = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
