<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <!-- htmx & Alpine.js -->
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/alpine.min.js" defer></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --background: #ffffff;
        --foreground: #1f2937;
        --card: #ffffff;
        --card-foreground: #1f2937;
        --primary: #1f2937;
        --primary-foreground: #fafafa;
        --secondary: #f4f4f5;
        --secondary-foreground: #1f2937;
        --muted: #f4f4f5;
        --muted-foreground: #6b7280;
        --accent: #f4f4f5;
        --accent-foreground: #1f2937;
        --destructive: #ef4444;
        --success: #10b981;
        --warning: #f59e0b;
        --border: #e5e7eb;
        --input: #e5e7eb;
        --ring: #a1a1aa;
        --radius: 0.75rem;
        --gradient-start: #fef3c7;
        --gradient-mid: #fca5a5;
        --gradient-end: #c084fc;
        --shape-1: #93c5fd;
        --shape-2: #a78bfa;
        --shape-3: #f0abfc;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f0f10;
          --foreground: #fafafa;
          --card: #18181b;
          --card-foreground: #fafafa;
          --primary: #e4e4e7;
          --primary-foreground: #18181b;
          --secondary: #27272a;
          --secondary-foreground: #fafafa;
          --muted: #27272a;
          --muted-foreground: #a1a1aa;
          --accent: #27272a;
          --accent-foreground: #fafafa;
          --destructive: #f87171;
          --success: #34d399;
          --warning: #fbbf24;
          --border: rgba(255, 255, 255, 0.1);
          --input: rgba(255, 255, 255, 0.15);
          --ring: #71717a;
          --gradient-start: #312e81;
          --gradient-mid: #581c87;
          --gradient-end: #831843;
          --shape-1: #3b82f6;
          --shape-2: #8b5cf6;
          --shape-3: #d946ef;
        }
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--background);
        color: var(--foreground);
      }

      .card {
        height: 100vh;
        display: grid;
        grid-template-columns: 45% 55%;
      }

      .illustration {
        background: linear-gradient(
          135deg,
          var(--gradient-start) 0%,
          var(--gradient-mid) 50%,
          var(--gradient-end) 100%
        );
        position: relative;
        padding: 3rem;
        display: flex;
        flex-direction: column;
      }

      .logo {
        height: 40px;
        width: auto;
        object-fit: contain;
        object-position: left;
      }

      .artwork {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .shape {
        position: absolute;
        border-radius: 50% 40% 60% 50%;
        filter: blur(60px);
        opacity: 0.6;
      }

      .shape1 {
        width: 280px;
        height: 320px;
        background: var(--shape-1);
        top: 20%;
        left: 10%;
      }
      .shape2 {
        width: 300px;
        height: 300px;
        background: var(--shape-2);
        top: 30%;
        left: 25%;
      }
      .shape3 {
        width: 200px;
        height: 280px;
        background: var(--shape-3);
        top: 45%;
        left: 40%;
      }

      .content {
        background: var(--card);
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
      }

      .content-wrapper {
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--card-foreground);
        margin-bottom: 0.5rem;
      }

      .subtitle {
        color: var(--muted-foreground);
        margin-bottom: 2.5rem;
        font-size: 0.9375rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--card-foreground);
        font-weight: 500;
        font-size: 0.875rem;
      }

      input[type="email"],
      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 0.875rem 1rem;
        border: 1px solid var(--border);
        background: var(--secondary);
        border-radius: var(--radius);
        font-size: 0.9375rem;
        transition: all 0.15s ease-in-out;
        color: var(--card-foreground);
      }

      input[type="email"]:focus,
      input[type="password"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--ring);
        box-shadow: 0 0 0 2px var(--ring);
      }

      input::placeholder {
        color: var(--muted-foreground);
      }

      .btn {
        width: 100%;
        padding: 0.875rem;
        background: var(--primary);
        color: var(--primary-foreground);
        border: none;
        border-radius: var(--radius);
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }

      .btn:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 0.875rem;
        border-radius: var(--radius);
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
        animation: slideIn 0.3s ease-out;
      }

      .alert-success {
        background: rgba(16, 185, 129, 0.1);
        color: var(--success);
        border: 1px solid rgba(16, 185, 129, 0.2);
      }

      .alert-error {
        background: rgba(239, 68, 68, 0.1);
        color: var(--destructive);
        border: 1px solid rgba(239, 68, 68, 0.2);
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .footer-link {
        text-align: center;
        margin-top: 1.5rem;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }

      .footer-link a {
        color: var(--ring);
        text-decoration: none;
        font-weight: 500;
      }

      .footer-link a:hover {
        text-decoration: underline;
      }

      .password-strength {
        margin-top: 0.5rem;
        font-size: 0.8125rem;
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }

      .strength-weak {
        color: var(--destructive);
      }
      .strength-medium {
        color: var(--warning);
      }
      .strength-strong {
        color: var(--success);
      }

      .icon {
        width: 18px;
        height: 18px;
        display: inline-block;
        vertical-align: middle;
      }

      .icon-sm {
        width: 14px;
        height: 14px;
      }

      .spinner {
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Responsive */
      @media (max-width: 968px) {
        .card {
          grid-template-columns: 1fr;
        }
        .illustration {
          display: none;
        }
        .content {
          padding: 2rem;
        }
      }

      @media (max-width: 480px) {
        .content {
          padding: 1.5rem;
        }
        h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body x-data="registerForm()">
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <h1>Create Account</h1>
          <p class="subtitle">Join us and start your journey today</p>

          <!-- Alerts -->
          <div
            x-show="success"
            x-transition
            class="alert alert-success"
            x-text="success"
          ></div>
          <div
            x-show="error"
            x-transition
            class="alert alert-error"
            x-text="error"
          ></div>

          <form @submit.prevent="handleSubmit">
            <div class="form-group">
              <label for="full_name">Full Name</label>
              <input
                type="text"
                id="full_name"
                name="full_name"
                x-model="fullName"
                required
                autocomplete="name"
                placeholder="John Doe"
              />
            </div>

            <div class="form-group">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                x-model="email"
                required
                autocomplete="email"
                placeholder="your@email.com"
              />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                x-model="password"
                @input="checkStrength"
                required
                autocomplete="new-password"
                placeholder="Create a strong password"
              />
              <div
                class="password-strength"
                :class="strengthClass"
                x-show="password.length > 0"
              >
                <img
                  x-show="strength === 'strong'"
                  src="/static/icons/circle-check.svg"
                  class="icon-sm"
                  :style="{ filter: 'invert(48%) sepia(79%) saturate(2476%) hue-rotate(86deg) brightness(118%) contrast(119%)' }"
                  alt=""
                />
                <img
                  x-show="strength === 'medium'"
                  src="/static/icons/triangle-alert.svg"
                  class="icon-sm"
                  :style="{ filter: 'invert(73%) sepia(60%) saturate(3000%) hue-rotate(3deg) brightness(108%) contrast(101%)' }"
                  alt=""
                />
                <img
                  x-show="strength === 'weak'"
                  src="/static/icons/shield-x.svg"
                  class="icon-sm"
                  :style="{ filter: 'invert(27%) sepia(94%) saturate(5057%) hue-rotate(352deg) brightness(96%) contrast(91%)' }"
                  alt=""
                />
                <span x-text="strengthText"></span>
              </div>
            </div>

            <button type="submit" class="btn" :disabled="loading">
              <template x-if="!loading">
                <span>Create Account</span>
              </template>
              <template x-if="loading">
                <span style="display: flex; align-items: center; gap: 0.5rem">
                  <img
                    src="/static/icons/loader-circle.svg"
                    class="icon spinner"
                    alt=""
                    style="filter: brightness(0) invert(1)"
                  />
                  Creating...
                </span>
              </template>
            </button>
          </form>

          <div class="footer-link">
            Already have an account?
            <a
              href="/oauth2/login{{ if .RequestID }}?request_id={{ .RequestID }}{{ end }}"
              >Sign in</a
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      function registerForm() {
        return {
          fullName: "",
          email: "",
          password: "",
          loading: false,
          error: "",
          success: "",
          strength: "",

          get strengthClass() {
            return `password-strength strength-${this.strength}`;
          },

          get strengthText() {
            if (this.strength === "strong") return "Strong password";
            if (this.strength === "medium") return "Medium strength";
            return "Weak password";
          },

          checkStrength() {
            const pwd = this.password;
            if (pwd.length < 8) {
              this.strength = "weak";
              return;
            }

            let conditions = 0;
            if (/[A-Z]/.test(pwd)) conditions++;
            if (/[a-z]/.test(pwd)) conditions++;
            if (/[0-9]/.test(pwd)) conditions++;
            if (/[^A-Za-z0-9]/.test(pwd)) conditions++;

            if (conditions >= 3 && pwd.length >= 12) {
              this.strength = "strong";
            } else if (conditions >= 2 && pwd.length >= 8) {
              this.strength = "medium";
            } else {
              this.strength = "weak";
            }
          },

          async handleSubmit() {
            this.error = "";
            this.success = "";
            this.loading = true;

            try {
              const response = await fetch("/api/v1/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  full_name: this.fullName,
                  email: this.email,
                  password: this.password,
                }),
              });

              const result = await response.json();

              if (!response.ok) {
                throw new Error(result.message || "Registration failed");
              }

              this.success =
                result.message || "Account created! Redirecting...";

              // Redirect immediately to OAuth auth endpoint (user is now logged in via session)
              globalThis.setTimeout(() => {
                const requestId = "{{ .RequestID }}";
                if (requestId) {
                  // Continue OAuth flow
                  globalThis.window.location.href = `/oauth2/auth?request_id=${requestId}`;
                } else {
                  // No OAuth flow, just go to login
                  globalThis.window.location.href = "/oauth2/login";
                }
              }, 1000);
            } catch (err) {
              this.error = err.message;
            } finally {
              this.loading = false;
            }
          },
        };
      }
    </script>
  </body>
</html>
