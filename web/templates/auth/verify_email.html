<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }

      .card {
        height: 100vh;
        display: grid;
        grid-template-columns: 45% 55%;
      }

      .illustration {
        background: linear-gradient(
          135deg,
          #d1fae5 0%,
          #a7f3d0 50%,
          #6ee7b7 100%
        );
        position: relative;
        padding: 3rem;
        display: flex;
        flex-direction: column;
      }

      .logo {
        height: 40px;
        width: auto;
        object-fit: contain;
        object-position: left;
      }

      .artwork {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .shape {
        position: absolute;
        border-radius: 50% 40% 60% 50%;
        filter: blur(60px);
        opacity: 0.6;
      }

      .shape1 {
        width: 280px;
        height: 320px;
        background: #6ee7b7;
        top: 20%;
        left: 10%;
      }

      .shape2 {
        width: 300px;
        height: 300px;
        background: #10b981;
        top: 30%;
        left: 25%;
      }

      .shape3 {
        width: 200px;
        height: 280px;
        background: #34d399;
        top: 45%;
        left: 40%;
      }

      .content {
        background: white;
        padding: 3rem 4rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow-y: auto;
      }

      .content-wrapper {
        max-width: 480px;
        margin: 0 auto;
        width: 100%;
        text-align: center;
      }

      .icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
        margin-bottom: 1rem;
        line-height: 1.2;
      }

      .message {
        color: #6b7280;
        margin-bottom: 2rem;
        font-size: 1rem;
        line-height: 1.6;
      }

      .success {
        background: #d1fae5;
        color: #065f46;
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-size: 0.9375rem;
        border: 1px solid #6ee7b7;
        display: none;
      }

      .error {
        background: #fee2e2;
        color: #dc2626;
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-size: 0.9375rem;
        border: 1px solid #fecaca;
        display: none;
      }

      .loading {
        color: #3b82f6;
        margin-bottom: 1.5rem;
      }

      .spinner {
        border: 3px solid #e5e7eb;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      button {
        padding: 0.875rem 2rem;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        text-decoration: none;
        display: inline-block;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
      }

      .footer-link {
        text-align: center;
        margin-top: 2rem;
        color: #6b7280;
        font-size: 0.875rem;
      }

      .footer-link a {
        color: #3b82f6;
        text-decoration: none;
        font-weight: 500;
        margin-left: 0.25rem;
      }

      .footer-link a:hover {
        text-decoration: underline;
      }

      /* Responsive */
      @media (max-width: 968px) {
        .card {
          grid-template-columns: 1fr;
        }

        .illustration {
          display: none;
        }

        .content {
          padding: 2rem;
        }
      }

      @media (max-width: 480px) {
        .content {
          padding: 1.5rem;
        }

        h1 {
          font-size: 1.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <div id="loadingState">
            <div class="spinner"></div>
            <h1>Verifying Your Email</h1>
            <p class="message">
              Please wait while we verify your email address...
            </p>
          </div>

          <div id="successState" style="display: none">
            <h1>Email Verified!</h1>
            <p class="message">
              Your email has been successfully verified. You can now sign in to
              your account.
            </p>
            <button onclick="window.location.href='/oauth2/login'">
              Go to Sign In
            </button>
          </div>

          <div id="errorState" style="display: none">
            <h1>Verification Failed</h1>
            <p class="message" id="errorMessage">
              The verification link is invalid or has expired.
            </p>
            <div class="footer-link">
              <a href="/oauth2/register">Create a new account</a> or
              <a href="/oauth2/login">Sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        showError("No verification token provided.");
      } else {
        verifyEmail(token);
      }

      async function verifyEmail(token) {
        try {
          const response = await fetch(
            `/api/v1/auth/verify-email?token=${encodeURIComponent(token)}`,
            {
              method: "GET",
            },
          );

          const data = await response.json();

          if (response.ok) {
            showSuccess();
          } else {
            showError(data.message || "Verification failed. Please try again.");
          }
        } catch (error) {
          showError("An error occurred. Please try again later.");
        }
      }

      function showSuccess() {
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("errorState").style.display = "none";
        document.getElementById("successState").style.display = "block";
      }

      function showError(message) {
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("successState").style.display = "none";
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorState").style.display = "block";
      }
    </script>
  </body>
</html>
