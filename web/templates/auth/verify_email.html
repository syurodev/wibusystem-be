<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Email</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
      .illustration {
        background: linear-gradient(
          135deg,
          #d1fae5 0%,
          #a7f3d0 50%,
          #6ee7b7 100%
        );
      }
      .shape1 {
        background: #6ee7b7;
      }
      .shape2 {
        background: #10b981;
      }
      .shape3 {
        background: #34d399;
      }

      .icon {
        font-size: 4rem;
        margin-bottom: 1.5rem;
        width: auto;
        height: auto;
      }

      .success,
      .error {
        padding: 1rem;
        font-size: 0.9375rem;
        display: none;
      }

      .message {
        color: #6b7280;
        margin-bottom: 2rem;
        font-size: 1rem;
        line-height: 1.6;
      }

      .spinner {
        border: 3px solid #e5e7eb;
        border-top: 3px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        margin: 0 auto 1rem;
      }

      .content-wrapper {
        text-align: center;
      }

      button {
        padding: 0.875rem 2rem;
        width: auto;
        display: inline-block;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="illustration">
        <img src="/images/logo.png" alt="Logo" class="logo" />
        <div class="artwork">
          <div class="shape shape1"></div>
          <div class="shape shape2"></div>
          <div class="shape shape3"></div>
        </div>
      </div>

      <div class="content">
        <div class="content-wrapper">
          <div id="loadingState">
            <div class="spinner"></div>
            <h1>Verifying Your Email</h1>
            <p class="message">
              Please wait while we verify your email address...
            </p>
          </div>

          <div id="successState" style="display: none">
            <h1>Email Verified!</h1>
            <p class="message">
              Your email has been successfully verified. You can now sign in to
              your account.
            </p>
            <button onclick="window.location.href='/oauth2/login'">
              Go to Sign In
            </button>
          </div>

          <div id="errorState" style="display: none">
            <h1>Verification Failed</h1>
            <p class="message" id="errorMessage">
              The verification link is invalid or has expired.
            </p>
            <div class="footer-link">
              <a href="/oauth2/register">Create a new account</a> or
              <a href="/oauth2/login">Sign in</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Get token from URL
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");

      if (!token) {
        showError("No verification token provided.");
      } else {
        verifyEmail(token);
      }

      async function verifyEmail(token) {
        try {
          const response = await fetch(
            `/api/v1/auth/verify-email?token=${encodeURIComponent(token)}`,
            {
              method: "GET",
            }
          );

          const data = await response.json();

          if (response.ok) {
            showSuccess();
          } else {
            showError(data.message || "Verification failed. Please try again.");
          }
        } catch (error) {
          showError("An error occurred. Please try again later.");
        }
      }

      function showSuccess() {
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("errorState").style.display = "none";
        document.getElementById("successState").style.display = "block";
      }

      function showError(message) {
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("successState").style.display = "none";
        document.getElementById("errorMessage").textContent = message;
        document.getElementById("errorState").style.display = "block";
      }
    </script>
  </body>
</html>
